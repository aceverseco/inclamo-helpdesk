uk:
  inclamo:
    # The tickets about one shopper (Inclamo::Erasure::Ticket), as
    # custom/config/locales/en.yml has them.
    erasure:
      inbox_name: Запити щодо даних
      contact_name: Запити Shopify щодо даних
      placeholder: "[видалено]"
      labels:
        inclamo_erasure_request: Shopify попросив видалити дані одного клієнта. Ці запити бачать лише адміністратори.
        inclamo_data_request: Клієнт попросив у магазину копію своїх даних. Ці запити бачать лише адміністратори.
      contacts:
        one: "контактів: %{count}"
        few: "контактів: %{count}"
        many: "контактів: %{count}"
        other: "контактів: %{count}"
      conversations:
        one: "розмов: %{count}"
        few: "розмов: %{count}"
        many: "розмов: %{count}"
        other: "розмов: %{count}"
      notes:
        erasure_made: |-
          Shopify від імені власника магазину попросив видалити дані одного клієнта.
          Знайдено в цьому обліковому записі — %{contacts}, %{conversations}. Електронна адреса й телефон клієнта та знайдені контакти — на картці цього запиту.
          Адміністратор може видалити дані зараз або призупинити видалення, вказавши причину. Якщо ніхто не видалить і не призупинить, хелпдеск видалить їх %{date}.
          Видалення прибирає контакти з усіма їхніми розмовами, повідомленнями й файлами. Після цього електронна адреса й телефон клієнта зникнуть із цього запиту; ім'я чи адреса, вписані в нотатку вручну, — ні, тож не пишіть їх тут.
        data_request_made: |-
          Клієнт через Shopify попросив у магазину копію своїх даних.
          Знайдено в цьому обліковому записі — %{contacts}, %{conversations}. Контакти — на картці цього запиту: дайте клієнтові відповідь з тим, що в них є, і позначте запит як виконаний. Хелпдеск не закриває цей запит сам.
          Після цього електронна адреса й телефон клієнта зникнуть із цього запиту; ім'я чи адреса, вписані в нотатку вручну, — ні, тож не пишіть їх тут.
        deleted_by: "Виконано: %{name} видалив(-ла) дані клієнта %{time}."
        deleted_automatically: "Виконано: ніхто не видалив і не призупинив, тож хелпдеск видалив дані клієнта %{time}."
        answered_by: "Виконано: %{name} позначив(-ла) запит як виконаний %{time}."
        held_by: "%{name} призупинив(-ла) автоматичне видалення. Відтепер за цей запит відповідає магазин. Причина — на картці цього запиту."
        lifted_before: "%{name} зняв(-ла) призупинення. Якщо ніхто не видалить, хелпдеск видалить дані клієнта %{date}."
        lifted_after: "%{name} зняв(-ла) призупинення. Дата автоматичного видалення минула: хелпдеск видалить дані клієнта під час наступної щоденної перевірки."
        reminder_erasure: "Нагадування: якщо ніхто не видалить і не призупинить, хелпдеск видалить дані цього клієнта %{date}."
        reminder_held: "Нагадування: видалення даних цього клієнта призупинено з %{date}. Запит не виконано; адміністратор може видалити дані або зняти призупинення."
        reminder_data_request: "Нагадування: %{date} клієнт попросив копію своїх даних. Дайте клієнтові відповідь і позначте запит як виконаний."
      errors:
        forbidden: Лише адміністратор може виконувати дії із запитом щодо даних клієнта.
