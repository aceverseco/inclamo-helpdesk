en:
  inclamo:
    authentication:
      invalid_credentials: Invalid credentials. Please try again.
      otp_code: Authenticator code (if two-factor authentication is enabled)
      backup_code: Or a recovery code
      mfa_setup: If your organization requires two-factor authentication, finish setup in the dashboard before signing in here.
    brand:
      welcome: Welcome to Inclamo
    shopify_connection:
      errors:
        forbidden: Only an administrator can manage the store connection.
        not_connected: No store is connected to this account.
        encryption_not_configured: Encryption must be configured on this installation before a store can be connected.
        already_connected: This account already has a store connection. Remove it before connecting another store.
        invalid_domain: Enter the store's domain in the form your-store.myshopify.com.
        app_not_installed: The app must be installed on the store first.
        credentials_refused: The store refused these credentials.
        missing_scopes: "The app lacks required access: %{missing_scopes}."
        orders_refused: Shopify refuses this app the store's orders. In the Dev Dashboard open the app's Distribution, choose custom distribution, then try again.
        shop_unavailable: This store cannot be reached. Check the domain.
        store_unreachable: Shopify did not answer. Try again in a moment.
    # The words for an order's payment and fulfilment status, in the panel and
    # in the reply variables. Keys are Shopify's display statuses.
    order_statuses:
      PAID: Paid
      PENDING: Payment pending
      AUTHORIZED: Authorized
      PARTIALLY_PAID: Partially paid
      PARTIALLY_REFUNDED: Partially refunded
      REFUNDED: Refunded
      VOIDED: Voided
      EXPIRED: Expired
      FULFILLED: Shipped
      UNFULFILLED: Not shipped
      PARTIALLY_FULFILLED: Partially shipped
      IN_PROGRESS: In progress
      ON_HOLD: On hold
      SCHEDULED: Scheduled
      RESTOCKED: Restocked
    order_roles:
      errors:
        forbidden: Only an administrator can decide who acts on orders.
    discounts:
      errors:
        forbidden: Only an administrator can manage discount presets and who gives discounts.
        not_allowed: You are not allowed to give discounts. Ask an administrator.
    order_actions:
      notes:
        cancel: "Cancelled order %{number}. %{details}"
        address: "Changed the shipping address of order %{number}."
        refund: "Refunded %{refunded} on order %{number}."
        replacement: "Created replacement order %{new_order_number} for order %{number}, free of charge."
        order_tags_add: "Added the tag \"%{tag}\" to order %{number}."
        order_tags_remove: "Removed the tag \"%{tag}\" from order %{number}."
        order_note: "Changed the note of order %{number}."
        customer_tags_add: "Added the tag \"%{tag}\" to the customer."
        customer_tags_remove: "Removed the tag \"%{tag}\" from the customer."
        customer_note: "Changed the customer's note."
        new_order: "Created order %{draft_name} for %{total}, awaiting payment. %{delivery}"
        edit_items: "Edited the items of order %{number}: %{changes}. %{money} %{details}"
        edit:
          quantity: "%{title} from %{from} to %{to}"
          removed: "%{title} removed (%{from})"
          added: "%{title} added (%{quantity})"
          money:
            owed: "The customer owes %{amount}."
            due_back: "%{amount} is due back to the customer."
            none: "The total did not change."
        discount: "Created discount code %{code} from the preset \"%{preset}\": %{value} off the order, %{uses}, %{audience}, %{expiry}."
        discount_details:
          uses:
            one: usable once
            other: "usable %{count} times"
          audience:
            customer: for this customer only
            anyone: for anyone, once per buyer
          expires: "expires on %{date}"
          never: never expires
        details:
          reason: "Reason: %{reason}."
          refunded: Payment refunded.
          restocked: Items restocked.
          notified: Customer notified.
          invoice_emailed: The store emailed its invoice to the customer.
          link_in_reply: The payment link was put into the reply.
          invoice_refused: The store did not send the invoice.
          invoice_unknown: It is not known whether the invoice was sent.
          link_not_sent: "The payment link was not sent yet: it is under Awaiting payment in the conversation's Orders section."
    macro_steps:
      stopped: "Macro \"%{macro}\" stopped at the step \"%{step}\": %{reason} The steps after it did not run."
      names:
        inclamo_refund_full: Refund the order in full
        inclamo_refund_shipping: Refund the shipping cost
        inclamo_cancel_order: Cancel the order
        inclamo_replacement: Send a free replacement
      reasons:
        no_order: no order is tied to this conversation, so there was no order to act on.
        not_allowed: you may not act on orders. An administrator has not given you the order-actions role.
        not_connected: no store is connected to this account.
        connection_broken: the store connection needs attention, Shopify no longer accepts it.
        missing_scope: "the store's app lacks access: %{scopes}."
        unknown_order: the tied order was not found in the store.
        nothing_to_refund: the store has nothing left to refund on this order.
        no_shipping_to_refund: the order has no shipping cost left to refund.
        already_cancelled: the order is already cancelled.
        not_free: "%{message}, so no replacement was created."
        store_refused: "the store refused: %{message}"
        store_unreachable: Shopify did not answer, so nothing was done.
        running: the store has not finished the cancellation yet. Check the order before telling the customer anything.
        unknown: the store did not confirm, so the outcome is unknown. Check the order in Shopify.
        pending: an earlier run of this step has not finished yet. Check the order before telling the customer anything.
        action_id_taken: the attempt of this step belongs to another order or conversation, so nothing was done.
        failed: it could not be done.
        failed_after_done: the store did it, but the helpdesk failed right after, so its own note of it may be missing. Check the order before telling the customer anything.
        other: "it could not be done (%{code})."
      unconfirmed:
        one_at_a_time: A macro that acts on orders runs in one conversation at a time, after a confirmation.
        not_confirmed: This macro acts on orders and was not confirmed as it is now, so no step of it ran. Reload the page and run it again.
    # The preset automation rules: the name and the description each rule is
    # created with, and the refusals of the presets endpoint.
    rule_presets:
      vip:
        name: VIP customers first
        about: Gives high priority and the label "vip" to a new conversation of a customer who spent more than the amount in the condition.
      not_shipped:
        name: Order not shipped yet
        about: Adds the label "awaiting-shipment" to a new conversation of a customer whose latest order has not been shipped.
      no_orders:
        name: No orders yet
        about: Adds the label "pre-sale" to a new conversation of someone who has not ordered from the store yet.
      errors:
        forbidden: Only an administrator can manage the preset rules.
        value_required: Enter an amount, zero or more, before switching this rule on.
        rule_invalid: Chatwoot does not accept this rule as it is now. Open it in the automation list, correct it and try again.
    # Team queues: the names the ready queues ship with, the descriptions of
    # the labels they list by, and the refusals of the queues endpoint.
    team_queues:
      names:
        urgent: Urgent
        ai_handover: Handed over by AI
        overdue: Overdue
        delivery: Delivery
        cancellation: Cancellation
        damage: Damage
        missing_parts: Missing parts
        return: Return
      labels:
        sla_overdue: An SLA target was missed and is still unmet. Lists the conversation in the queue "Overdue".
        delivery: A question about delivery. Lists the conversation in the queue "Delivery".
        cancellation: A request to cancel an order. Lists the conversation in the queue "Cancellation".
        damage: A damaged item. Lists the conversation in the queue "Damage".
        missing_parts: A missing part or item. Lists the conversation in the queue "Missing parts".
        return: A return. Lists the conversation in the queue "Return".
      errors:
        forbidden: Only an administrator can manage the team queues.
        name_invalid: Give the queue a name of at most 60 characters.
        too_many_visible: At most 20 team queues can be shown. Hide another queue first.
        order_incomplete: The new order has to name every team queue once.
        not_ready: Only a ready queue can be restored.
    # The saved replies every account starts with (short codes in
    # Inclamo::ReadyReplies). Only variables of the reply-order-variables contract.
    ready_replies:
      delivery: "Thanks for getting in touch. Your order {{order.number}} is on its way. You can follow it here: {{order.tracking_link}}"
      cancellation: "We have received your request to cancel order {{order.number}}. We are checking whether it can still be stopped and will confirm shortly."
      damage: "We are sorry your item arrived damaged. Could you send us a photo of the item and of the packaging? We will sort it out as soon as we have them."
      missing_parts: "We are sorry something is missing from your order. Could you tell us which part or item is missing, with its number from the manual if there is one? We will send it out."
      return: "We can help with a return of order {{order.number}}. Could you tell us which item you would like to return and why?"
    sla:
      label_description: A target of an SLA policy was missed in this conversation.
      notes:
        first_response: "SLA \"%{policy}\": the first-response target of %{target} was missed."
        resolution: "SLA \"%{policy}\": the resolution target of %{target} was missed."
      units:
        day:
          one: "%{count} day"
          other: "%{count} days"
        hour:
          one: "%{count} hour"
          other: "%{count} hours"
        minute:
          one: "%{count} minute"
          other: "%{count} minutes"
        second:
          one: "%{count} second"
          other: "%{count} seconds"
      errors:
        forbidden: Only an administrator can manage SLA policies.
        name_needed: Give the policy a name.
        name_too_long: A name can be at most 120 characters long.
        target_needed: Set a first-response target, a resolution target or both.
        first_response_range: The first-response target must be more than zero and at most 365 days.
        resolution_range: The resolution target must be more than zero and at most 365 days.
        business_hours_needed: Say whether the policy counts business hours only.
        all_inboxes_needed: Say whether the policy covers all inboxes or chosen ones.
        inboxes_needed: Choose at least one inbox, or let the policy cover all inboxes.
        unknown_inbox: One of the chosen inboxes is not in this account.
    ai_connection:
      bot_name: AI agent
      bot_description: Answers shoppers first and hands conversations over to the team. Managed on the AI agent page.
      errors:
        forbidden: Only an administrator can manage the AI agent.
        encryption_not_configured: Encryption must be configured on this installation before the AI agent can be connected.
        invalid_code: This is not a valid connection code.
        no_inboxes: Choose at least one inbox for the AI agent.
        invalid_inbox: One of the chosen inboxes cannot be given to the AI agent.
        inbox_has_bot: One of the chosen inboxes already has another bot.
        already_connected: The AI agent is already connected to this account.
        not_connected: The AI agent is not connected to this account.
        busy: The connection is being changed right now. Try again in a moment.
        not_answered: The AI service did not answer. Try again in a moment.
        refused_without_message: The AI service refused the connection code.
    ai_agent:
      errors:
        unauthorized: Only the connected AI agent can make this call.
        forbidden: This conversation is not one the AI agent handles.
        no_labels: Name at least one label to add.
        too_many_labels: Add at most 20 labels at a time.
        invalid_label: Labels of the AI agent start with inclamo_ and hold only lower case letters, digits, _ and -.
        conversation_not_pending: The conversation is no longer the AI agent's. Nothing was posted; do not send this reply again.
        empty_reply: A reply needs text.
