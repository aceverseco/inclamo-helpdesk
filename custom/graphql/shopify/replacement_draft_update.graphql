# Second step: the items the agent kept, fully discounted, with free shipping.
mutation replacement_draft_update($id: ID!, $input: DraftOrderInput!) {
  draftOrderUpdate(id: $id, input: $input) {
    draftOrder {
      id
      totalPriceSet { shopMoney { amount currencyCode } }
    }
    userErrors {
      field
      message
    }
  }
}
