# A draft as the panel lists it among the orders awaiting payment.
fragment AwaitingDraftFields on DraftOrder {
  id
  legacyResourceId
  name
  status
  createdAt
  invoiceUrl
  invoiceSentAt
  totalPriceSet { shopMoney { amount currencyCode } }
  lineItems(first: 20) {
    nodes {
      name
      quantity
    }
  }
}
