# One refund per key: sent again with the same key, the store answers with the
# refund it already made.
mutation refund_create($input: RefundInput!, $key: String!) {
  refundCreate(input: $input) @idempotent(key: $key) {
    refund {
      id
      totalRefundedSet { shopMoney { amount currencyCode } }
    }
    userErrors {
      field
      message
    }
  }
}
