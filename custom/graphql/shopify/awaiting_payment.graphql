# Orders a customer has not paid yet: drafts made from the helpdesk, newest
# first. The query names the customer, our tag and the open statuses. The
# marker is the id of the action that made the draft.
query awaiting_payment($query: String!, $first: Int!) {
  draftOrders(first: $first, query: $query, sortKey: UPDATED_AT, reverse: true) {
    nodes {
      id
      legacyResourceId
      name
      status
      createdAt
      invoiceUrl
      invoiceSentAt
      totalPriceSet { shopMoney { amount currencyCode } }
      marker: metafield(namespace: "inclamo", key: "action_id") { value }
      lineItems(first: 20) {
        nodes {
          name
          quantity
        }
      }
    }
  }
}
