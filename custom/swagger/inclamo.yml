                      $ref: '#/components/schemas/DiscountPreset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
    post:
      tags: [Discounts]
      operationId: inclamoDiscountPresetsCreate
      summary: Add a preset
