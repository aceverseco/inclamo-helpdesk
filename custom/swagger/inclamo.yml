      responses:
        '200':
          description: The remaining presets.
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscountPreset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such preset.

  # ─────────────────────────── Rule presets ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/rule_presets:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Rule presets]
      operationId: inclamoRulePresetsIndex
      summary: The preset rules and whether each is on
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/RulePresets'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'

  /api/v1/accounts/{account_id}/inclamo/rule_presets/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: id
        in: path
        required: true
        description: The preset's key.
        schema:
          type: string
          enum: [vip, not_shipped, no_orders]
    patch:
      tags: [Rule presets]
      operationId: inclamoRulePresetsUpdate
      summary: Switch a preset on or off
      description: |
        On creates an ordinary Chatwoot automation rule (or activates the one
        made earlier); off deactivates it and changes nothing else. `vip`
        needs `value`, the amount spent. Also accepted as `PUT`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
                value:
                  type: string
                  description: A non-negative amount, for presets with `needs_value`.
                  examples: ['500']
      responses:
        '200':
          $ref: '#/components/responses/RulePresets'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: Unknown preset.
        '422':
          description: '`value_required` or `rule_invalid`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  # ─────────────────────────── Team queues ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/team_queues:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Team queues]
      operationId: inclamoTeamQueuesIndex
      summary: The visible queues with the member's counts
      parameters:
        - name: all
          in: query
          description: For administrators, `1` adds the hidden queues (without a count).
          schema:
            type: string
            enum: ['1', 'true']
      responses:
        '200':
          $ref: '#/components/responses/TeamQueues'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/accounts/{account_id}/inclamo/team_queues/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/TeamQueueId'
    patch:
      tags: [Team queues]
      operationId: inclamoTeamQueuesUpdate
      summary: Rename, hide or show a queue
      description: Also accepted as `PUT`. At most `limit` queues are visible.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                hidden:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/TeamQueues'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such queue.
        '422':
          description: '`name_invalid`, `hidden_invalid` or `too_many_visible`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  /api/v1/accounts/{account_id}/inclamo/team_queues/reorder:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Team queues]
      operationId: inclamoTeamQueuesReorder
      summary: Put the queues in a new order
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  description: Every queue of the account, in the new order.
                  items:
                    type: integer
      responses:
        '200':
          $ref: '#/components/responses/TeamQueues'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '422':
          description: '`order_incomplete`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  /api/v1/accounts/{account_id}/inclamo/team_queues/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/TeamQueueId'
    post:
      tags: [Team queues]
      operationId: inclamoTeamQueuesRestore
      summary: Restore a ready queue as it shipped
      description: Name, membership and place as shipped; whether it is hidden stays.
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/TeamQueues'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such queue.
        '422':
          description: '`not_ready`: the queue is not one of the ready queues.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  /api/v1/accounts/{account_id}/inclamo/team_queues/sla_overview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Team queues, SLA]
      operationId: inclamoTeamQueuesSlaOverview
      summary: Overdue, soon and other conversations per queue
      description: For the "SLA overview" widget. Cached for 30 seconds per member.
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'

  # ─────────────────────────── SLA ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/sla_policies:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [SLA]
      operationId: inclamoSlaPoliciesIndex
      summary: The SLA policies and the account's inboxes
      x-required-role: administrator
      responses:
        '200':
          description: The policies.
          content:
            application/json:
              schema:
                type: object
                required: [policies, inboxes]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlaPolicy'
                  inboxes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        business_hours:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
    post:
      tags: [SLA]
      operationId: inclamoSlaPoliciesCreate
      summary: Add a policy
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaPolicyInput'
      responses:
        '201':
          $ref: '#/components/responses/SlaPolicySaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '422':
          $ref: '#/components/responses/SlaPolicyInvalid'

  /api/v1/accounts/{account_id}/inclamo/sla_policies/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [SLA]
      operationId: inclamoSlaPoliciesUpdate
      summary: Change a policy
      description: Also accepted as `PUT`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaPolicyInput'
      responses:
        '200':
          $ref: '#/components/responses/SlaPolicySaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such policy.
        '422':
          $ref: '#/components/responses/SlaPolicyInvalid'
    delete:
      tags: [SLA]
      operationId: inclamoSlaPoliciesDestroy
      summary: Remove a policy
      x-required-role: administrator
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such policy.

  /api/v1/accounts/{account_id}/inclamo/sla_policies/reorder:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [SLA]
      operationId: inclamoSlaPoliciesReorder
      summary: Put the policies in a new order
      description: The first policy that covers a conversation applies.
      x-required-role: administrator
      x-notes: How an incomplete or foreign list of ids is answered is decided by Inclamo::SlaPolicy.reorder!; not restated here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: The policies in their new order.
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlaPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'

  /api/v1/accounts/{account_id}/inclamo/sla_policies/summary:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [SLA]
      operationId: inclamoSlaPoliciesSummary
      summary: Met and missed targets per policy
      x-required-role: administrator
      parameters:
        - name: days
          in: query
          description: The period; anything else means 7.
          schema:
            type: integer
            enum: [7, 30]
            default: 7
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                required: [days, policies]
                properties:
                  days:
                    type: integer
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlaSummaryRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'

  /api/v1/accounts/{account_id}/inclamo/conversations/{conversation_id}/sla:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [SLA]
      operationId: inclamoConversationSla
      summary: The SLA timer of a conversation
      description: '`pending`: no timer yet, but a policy covers the conversation; ask again shortly.'
      responses:
        '200':
          description: The timer.
          content:
            application/json:
              schema:
                type: object
                required: [timer, pending]
                properties:
                  timer:
                    oneOf:
                      - $ref: '#/components/schemas/SlaTimer'
                      - type: 'null'
                  pending:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/conversation_slas:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [SLA]
      operationId: inclamoConversationSlaBatch
      summary: The SLA timers of several conversations
      description: |
        For the badges of a conversation list. A conversation the member may
        not see, or that is not the account's, is left out.
      parameters:
        - name: ids
          in: query
          required: true
          description: Display ids, separated by commas (or `ids[]=` repeated). At most 100.
          schema:
            type: string
            examples: ['101,102,103']
      responses:
        '200':
          description: The timers.
          content:
            application/json:
              schema:
                type: object
                required: [timers, pending]
                properties:
                  timers:
                    type: object
                    description: Per display id (as a string key), the timer or null.
                    additionalProperties:
                      oneOf:
                        - $ref: '#/components/schemas/SlaTimer'
                        - type: 'null'
                  pending:
                    type: array
                    description: Display ids whose timer is still being applied.
                    items:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: '`too_many_ids`, with `limit`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: too_many_ids
                  limit:
                    type: integer
                    examples: [100]

  # ─────────────────────────── Shopper requests ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/shopper_requests/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ShopperRequestId'
    get:
      tags: [Shopper requests]
      operationId: inclamoShopperRequestShow
      summary: The ticket card of a request about one shopper
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/ShopperRequestCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such request in the account.

  /api/v1/accounts/{account_id}/inclamo/shopper_requests/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ShopperRequestId'
    post:
      tags: [Shopper requests]
      operationId: inclamoShopperRequestErase
      summary: Delete the shopper's data now
      description: For an erasure that is waiting or held.
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/ShopperRequestCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such request in the account.
        '409':
          $ref: '#/components/responses/ShopperRequestWrongState'
        '503':
          $ref: '#/components/responses/ShopperRequestNotDone'

  /api/v1/accounts/{account_id}/inclamo/shopper_requests/{id}/hold:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ShopperRequestId'
    post:
      tags: [Shopper requests]
      operationId: inclamoShopperRequestHold
      summary: Stop the automatic deletion
      description: For an erasure that is waiting. A reason is required.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/ShopperRequestCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such request in the account.
        '409':
          $ref: '#/components/responses/ShopperRequestWrongState'
        '422':
          description: '`reason_missing`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'
        '503':
          $ref: '#/components/responses/ShopperRequestNotDone'

  /api/v1/accounts/{account_id}/inclamo/shopper_requests/{id}/lift:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ShopperRequestId'
    post:
      tags: [Shopper requests]
      operationId: inclamoShopperRequestLift
      summary: Let the automatic deletion run on its date again
      description: For an erasure that is held.
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/ShopperRequestCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such request in the account.
        '409':
          $ref: '#/components/responses/ShopperRequestWrongState'
        '503':
          $ref: '#/components/responses/ShopperRequestNotDone'

  /api/v1/accounts/{account_id}/inclamo/shopper_requests/{id}/answered:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ShopperRequestId'
    post:
      tags: [Shopper requests]
      operationId: inclamoShopperRequestAnswered
      summary: The team has answered the shopper's data request
      description: For a data request that is waiting.
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/ShopperRequestCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such request in the account.
        '409':
          $ref: '#/components/responses/ShopperRequestWrongState'
        '503':
          $ref: '#/components/responses/ShopperRequestNotDone'

  # ─────────────────────────── AI agent connection ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/ai/connection:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [AI agent connection]
      operationId: inclamoAiConnectionShow
      summary: The AI agent connection
      description: No answer carries the bot's token or secret, the code, or a conversation's content.
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/AiConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiConnectionError'
    post:
      tags: [AI agent connection]
      operationId: inclamoAiConnectionCreate
      summary: Connect the AI agent with a connection code
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_code]
              properties:
                connection_code:
                  type: string
                  description: The code the AI service issued, `aic1.<base64url>`.
                inbox_ids:
                  type: array
                  description: The inboxes the agent answers in.
                  items:
                    type: integer
      responses:
        '201':
          $ref: '#/components/responses/AiConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiConnectionError'
        '409':
          $ref: '#/components/responses/AiConnectionError'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: '#/components/responses/AiConnectionError'
        '502':
          $ref: '#/components/responses/AiConnectionError'
    patch:
      tags: [AI agent connection]
      operationId: inclamoAiConnectionUpdate
      summary: Change the inboxes the agent answers in
      description: |
        The whole list after the change, possibly empty. The AI service is
        told first. Also accepted as `PUT`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inbox_ids]
              properties:
                inbox_ids:
                  type: array
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/AiConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiConnectionError'
        '404':
          $ref: '#/components/responses/AiConnectionError'
        '409':
          $ref: '#/components/responses/AiConnectionError'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: '#/components/responses/AiConnectionError'
        '502':
          $ref: '#/components/responses/AiConnectionError'
    delete:
      tags: [AI agent connection]
      operationId: inclamoAiConnectionDestroy
      summary: Disconnect the AI agent
      x-required-role: administrator
      responses:
        '200':
          description: The connection after the disconnection; `ai_service_told` says whether the AI service was told.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AiConnection'
                  - type: object
                    required: [ai_service_told]
                    properties:
                      ai_service_told:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiConnectionError'
        '404':
          $ref: '#/components/responses/AiConnectionError'
        '409':
          $ref: '#/components/responses/AiConnectionError'

  # ─────────────────────────── AI policies ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/ai_policies:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [AI policies]
      operationId: inclamoAiPoliciesIndex
      summary: The AI agent's policy per action
      x-required-role: administrator
      responses:
        '200':
          $ref: '#/components/responses/AiPolicies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'

  /api/v1/accounts/{account_id}/inclamo/ai_policies/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: id
        in: path
        required: true
        description: The action.
        schema:
          $ref: '#/components/schemas/ActionName'
    patch:
      tags: [AI policies]
      operationId: inclamoAiPoliciesUpdate
      summary: Set the policy of one action
      description: |
        `autonomous` needs limits: a maximum amount in the store's currency for
        actions that move money, allowed fulfillment states for order
        actions, a maximum percentage for `discount`. Also accepted as `PUT`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/AiPolicyMode'
                limits:
                  $ref: '#/components/schemas/AiPolicyLimits'
      responses:
        '200':
          $ref: '#/components/responses/AiPolicies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '404':
          description: Unknown action.
        '422':
          description: '`invalid_policy` with the validation messages.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  # ─────────────────────────── AI proposals ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/conversations/{conversation_id}/ai_proposals:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [AI proposals]
      operationId: inclamoAiProposalsIndex
      summary: The AI agent's proposals in a conversation
      description: The 30 newest.
      responses:
        '200':
          description: The proposals.
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/conversations/{conversation_id}/ai_proposals/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AiProposalId'
    post:
      tags: [AI proposals]
      operationId: inclamoAiProposalsApprove
      summary: Approve a proposal and carry it out
      description: '`review_digest` is the one the member reviewed; a proposal changed since is refused.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_digest]
              properties:
                review_digest:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/AiProposalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiProposalNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AiProposalRefused'
        '502':
          $ref: '#/components/responses/StoreUnavailable'

  /api/v1/accounts/{account_id}/inclamo/conversations/{conversation_id}/ai_proposals/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AiProposalId'
    post:
      tags: [AI proposals]
      operationId: inclamoAiProposalsReject
      summary: Reject a proposal
      responses:
        '200':
          $ref: '#/components/responses/AiProposalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiProposalNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AiProposalRefused'

  /api/v1/accounts/{account_id}/inclamo/conversations/{conversation_id}/ai_proposals/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AiProposalId'
    post:
      tags: [AI proposals]
      operationId: inclamoAiProposalsRefresh
      summary: Read the store again for a proposal's summary
      responses:
        '200':
          $ref: '#/components/responses/AiProposalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiProposalNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AiProposalRefused'
        '502':
          $ref: '#/components/responses/StoreUnavailable'

  /api/v1/accounts/{account_id}/inclamo/conversations/{conversation_id}/ai_proposals/{id}/verify_identity:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AiProposalId'
    post:
      tags: [AI proposals]
      operationId: inclamoAiProposalsVerifyIdentity
      summary: Record that the member verified the shopper's identity
      responses:
        '200':
          $ref: '#/components/responses/AiProposalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiProposalNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AiProposalRefused'
        '502':
          $ref: '#/components/responses/StoreUnavailable'

  # ─────────────────────────── AI agent connector ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [AI agent connector]
      operationId: inclamoAiConversationMessages
      summary: A conversation's public history with its files
      description: The last public messages, oldest first. Private notes, activity and template messages are left out.
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiHistory'
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'

  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/reply:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [AI agent connector]
      operationId: inclamoAiConversationReply
      summary: Post the agent's reply, only while the conversation is Pending
      description: |
        Checked and saved under the conversation's lock: the reply is either
        posted before a person's take-over or refused with `409`, and never
        appears after it. On `409` the turn did not happen.
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Posted.
          content:
            application/json:
              schema:
                type: object
                required: [id, created_at]
                properties:
                  id:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'
        '409':
          description: '`conversation_not_pending`, with the conversation''s `status`. Nothing was posted.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OverlayError'
                  - type: object
                    properties:
                      status:
                        type: string
                        examples: [open]
        '422':
          description: '`empty_reply`, or `invalid_request` when Chatwoot refused the message.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/labels:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [AI agent connector]
      operationId: inclamoAiConversationLabels
      summary: Add `inclamo_` labels, keeping every other label
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [add]
              properties:
                add:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    pattern: '^inclamo_'
                    maxLength: 100
      responses:
        '200':
          description: The conversation's full list of labels.
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'
        '422':
          description: '`no_labels`, `too_many_labels` or `invalid_label` (with up to five `invalid` names). Nothing was added.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OverlayError'
                  - type: object
                    properties:
                      invalid:
                        type: array
                        items:
                          type: string

  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/orders:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [AI agent connector]
      operationId: inclamoAiConversationOrders
      summary: The matched customer, their orders and the AI policies
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      responses:
        '200':
          description: What the agent may act on.
          content:
            application/json:
              schema:
                type: object
                required: [customer, orders, policies, identity_verified]
                properties:
                  customer:
                    $ref: '#/components/schemas/CustomerCandidate'
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiPolicy'
                  identity_verified:
                    type: boolean
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'
        '409':
          $ref: '#/components/responses/AiProposalRefused'
        '502':
          $ref: '#/components/responses/StoreUnavailable'

  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/proposals:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [AI agent connector]
      operationId: inclamoAiConversationPropose
      summary: Propose an order action
      description: |
        `request_id` is the agent's key; the same request again answers the
        proposal already made, a different one under a used key is
        `409 request_id_taken`.
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_name, request_id]
              properties:
                action_name:
                  $ref: '#/components/schemas/ActionName'
                request_id:
                  type: string
                  pattern: '^[A-Za-z0-9-]{8,64}$'
                order_id:
                  type: string
                customer_id:
                  type: string
                note:
                  type: string
                address:
                  type: object
                  additionalProperties: true
                params:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          $ref: '#/components/responses/AiProposalCreated'
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'
        '409':
          $ref: '#/components/responses/AiProposalRefused'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/StoreUnavailable'

  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/proposals/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AiProposalId'
    get:
      tags: [AI agent connector]
      operationId: inclamoAiConversationProposal
      summary: One of the agent's proposals
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AiProposalResult'
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/ai/conversations/{conversation_id}/proposals/{id}/execute:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AiProposalId'
    post:
      tags: [AI agent connector]
      operationId: inclamoAiConversationExecute
      summary: Carry out a proposal on the agent's own authority
      description: Only within an `autonomous` policy and its limits.
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AiProposalResult'
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '403':
          $ref: '#/components/responses/AiAgentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AiProposalRefused'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/StoreUnavailable'

  /api/v1/accounts/{account_id}/inclamo/calls:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [AI agent connector]
      operationId: inclamoAiCallFile
      summary: File a finished call of the AI phone agent
      description: |
        Files the call as a resolved conversation of the account's Phone inbox
        on the caller's contact: the turns as messages, the record as a
        private note (docs/ai-connector-calls.md). The same `call_id` again
        answers `200` with the conversation filed before. Card numbers are
        masked; a refusal never repeats a part of the call.
      security:
        - agentBotApiKey: []
        - agentBotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallFiling'
      responses:
        '200':
          $ref: '#/components/responses/CallFiled'
        '201':
          $ref: '#/components/responses/CallFiled'
        '401':
          $ref: '#/components/responses/AiAgentUnauthorized'
        '409':
          description: '`not_connected`: the AI agent is not connected, or the Phone inbox is gone.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'
        '422':
          description: '`invalid_call`, `invalid_label` or `too_large`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'

components:
  securitySchemes:
    userApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: A user's access token from **Profile Settings** (Chatwoot's scheme of the same name).
    userBearerAuth:
      type: http
      scheme: bearer
      description: 'The same user access token as `Authorization: Bearer <token>` (Chatwoot v4.19.0 and later).'
    agentBotApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: The agent bot token of the account's connected AI agent. Only the AI agent connector paths accept it.
    agentBotBearerAuth:
      type: http
      scheme: bearer
      description: 'The connected AI agent''s bot token as `Authorization: Bearer <token>`.'
    sessionAccessToken:
      type: apiKey
      in: header
      name: access-token
      description: Dashboard session (DeviseTokenAuth), sent together with `client` and `uid`.
    sessionClient:
      type: apiKey
      in: header
      name: client
      description: Dashboard session (DeviseTokenAuth).
    sessionUid:
      type: apiKey
      in: header
      name: uid
      description: Dashboard session (DeviseTokenAuth).

  headers:
    NoStore:
      description: '`no-store`'
      schema:
        type: string

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      description: The account's numeric id.
      schema:
        type: integer
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: The conversation's display id (the number in the dashboard's address).
      schema:
        type: integer
    WebWidgetInboxId:
      name: id
      in: path
      required: true
      description: The id of a web widget inbox.
      schema:
        type: integer
    SupportRequestId:
      name: id
      in: path
      required: true
      description: The request's `reference`.
      schema:
        type: string
        format: uuid
    SupportFileId:
      name: file_id
      in: path
      required: true
      description: The file's id or `reference` as the request lists it.
      schema:
        type: string
    MemberUserId:
      name: id
      in: path
      required: true
      description: The member's user id.
      schema:
        type: integer
    TeamQueueId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ShopperRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AiProposalId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  requestBodies:
    OrderPreview:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [order_id]
            properties:
              order_id:
                type: string
              params:
                type: object
                additionalProperties: true

  responses:
    Unauthorized:
      description: Not signed in, not a member of the account, the account is suspended, or Chatwoot's policy refused the record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    NotFound:
      description: No such record in the account (Chatwoot's answer, or an empty body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    ForbiddenEmpty:
      description: Not an administrator of the account (empty body).
    OverlayForbidden:
      description: '`forbidden` (or `not_allowed`) with a message.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    InvalidRequest:
      description: '`invalid_request`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    StoreUnavailable:
      description: '`store_unavailable`: the store did not answer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    StoreUnreachable:
      description: '`store_unreachable`, with `reason`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    StoreRefusalForbidden:
      description: '`not_allowed`: the member lacks the right.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreRefusal'
    StoreRefusalInvalid:
      description: The action is refused (for example `unknown_order`, `store_refused`, `missing_scope`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreRefusal'
    StoreRefusalGateway:
      description: '`store_unreachable`, with `reason`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreRefusal'
    LayoutConflict:
      description: '`layout_conflict`: the revision changed since it was read.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    LayoutInvalid:
      description: The layout is refused; `error` names why (`invalid_layout`, `unknown_widget`, `invalid_target`, …).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    SupportInvalid:
      description: The request is refused; `error` names why (`invalid_file`, `invalid_reference`, `file_count`, `invalid_files`, `invalid_cursor`, `invalid_request`, …).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    SupportConflict:
      description: '`submission_conflict`: the `uuid` is taken by a different submission.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    SupportRateLimited:
      description: '`rate_limited`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    SupportUnavailable:
      description: '`support_unavailable`: Inclamo support did not answer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    SafeDownload:
      description: 'The file, as an attachment download with `X-Content-Type-Options: nosniff`, `Cache-Control: private, no-store` and a sandboxing `Content-Security-Policy`.'
      content:
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
    OrderRoleMembers:
      description: Every member with their order rights.
      content:
        application/json:
          schema:
            type: object
            required: [members]
            properties:
              members:
                type: array
                items:
                  $ref: '#/components/schemas/OrderRoleMember'
    DiscountGrantMembers:
      description: Every member with whether they may give discounts.
      content:
        application/json:
          schema:
            type: object
            required: [members]
            properties:
              members:
                type: array
                items:
                  $ref: '#/components/schemas/DiscountGrantMember'
    OrderPanel:
      description: The "Orders" section.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderPanel'
    OrderActionResult:
      description: The attempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderAction'
    DiscountPresetSaved:
      description: The preset and every preset.
      content:
        application/json:
          schema:
            type: object
            required: [preset, presets]
            properties:
              preset:
                $ref: '#/components/schemas/DiscountPreset'
              presets:
                type: array
                items:
                  $ref: '#/components/schemas/DiscountPreset'
    DiscountPresetInvalid:
      description: '`invalid`, with the error codes per field.'
      content:
        application/json:
          schema:
            type: object
            required: [error, fields]
            properties:
              error:
                const: invalid
              fields:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    RulePresets:
      description: The presets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulePresets'
    TeamQueues:
      description: The queues.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamQueueListing'
    SlaPolicySaved:
      description: The policy.
      content:
        application/json:
          schema:
            type: object
            required: [policy]
            properties:
              policy:
                $ref: '#/components/schemas/SlaPolicy'
    SlaPolicyInvalid:
      description: '`invalid`, with messages and the fields at fault.'
      content:
        application/json:
          schema:
            type: object
            required: [error, messages, fields]
            properties:
              error:
                const: invalid
              messages:
                type: array
                items:
                  type: string
              fields:
                type: array
                items:
                  type: string
    ShopperRequestCard:
      description: The ticket card.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShopperRequestCard'
    ShopperRequestWrongState:
      description: '`wrong_state`: the request is not in a state that allows this; `state` is its state.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                const: wrong_state
              state:
                type: string
    ShopperRequestNotDone:
      description: '`not_done`: the journal could not be written, nothing was done.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    AiConnection:
      description: The connection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiConnection'
    AiConnectionError:
      description: |
        `forbidden` (403), `not_connected` (404), `already_connected` or `busy`
        (409), `not_applied` (500: the AI service accepted a change the
        helpdesk could not apply), `not_answered` (502), or another code (422).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    AiConnectionRefused:
      description: '`refused` by the AI service (with its `service_error`), `invalid_inbox`, or another code.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OverlayError'
              - type: object
                properties:
                  service_error: {}
    AiPolicies:
      description: The policies.
      content:
        application/json:
          schema:
            type: object
            required: [policies, currency, allowed_states]
            properties:
              policies:
                type: array
                items:
                  $ref: '#/components/schemas/AiPolicy'
              currency:
                type: [string, 'null']
                description: The connected store's currency.
              allowed_states:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentState'
    AiProposalResult:
      description: The proposal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiProposal'
    AiProposalCreated:
      description: The proposal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiProposal'
    AiProposalNotAllowed:
      description: '`not_allowed`: the member may not carry out this action.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    AiProposalRefused:
      description: The order authority refused; `error` names why (for example `already_decided`, `request_id_taken`, `not_connected`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatwootError'
    AiAgentUnauthorized:
      description: '`unauthorized`: not the connected AI agent''s bot token.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    AiAgentForbidden:
      description: '`forbidden`: the conversation does not exist or is outside the connected inboxes.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverlayError'
    CallFiled:
      description: '`201` filed now, `200` filed before under the same `call_id`.'
      content:
        application/json:
          schema:
            type: object
            required: [conversation_id, contact_id, found, matched_by, labels_added]
            properties:
              conversation_id:
                type: integer
                description: The conversation's display id.
              contact_id:
                type: integer
              found:
                type: boolean
                description: The call was filed before.
              matched_by:
                type: string
                enum: [phone, email, created, anonymous, ambiguous]
              labels_added:
                type: array
                items:
                  type: string

  schemas:
    ChatwootError:
      type: object
      properties:
        error:
          type: string
    OverlayError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A stable code.
        message:
          type: string
          description: A sentence for a person, in the member's language.
        reason:
          type: string
      additionalProperties: true
    StoreRefusal:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: The refusal code (`not_allowed`, `store_refused`, `store_unreachable`, `unknown_order`, …).
        message:
          type: string
        reason:
          type: string
          description: For `store_unreachable`, what went wrong (`timeout`, `throttled`, …).
    Health:
      type: object
      required: [status, failing, overlay_version, chatwoot_version]
      properties:
        status:
          type: string
          enum: [ok, failing]
        failing:
          type: array
          items:
            type: string
            enum: [database, redis, workers, backup, restore_test, disk]
        overlay_version:
          type: string
        chatwoot_version:
          type: string
    ActionName:
      type: string
      enum: [address, edit_items, cancel, refund, new_order, replacement, discount, order_tags, order_note, customer_tags, customer_note]
    Permissions:
      type: object
      description: Per action, whether the member may perform it. Administrators have every right.
      properties:
        address: {type: boolean}
        edit_items: {type: boolean}
        cancel: {type: boolean}
        refund: {type: boolean}
        new_order: {type: boolean}
        replacement: {type: boolean}
        discount: {type: boolean}
        order_tags: {type: boolean}
        order_note: {type: boolean}
        customer_tags: {type: boolean}
        customer_note: {type: boolean}
    Money:
      type: object
      properties:
        amount:
          type: [string, 'null']
          examples: ['19.99']
        currency:
          type: [string, 'null']
          examples: [EUR]
    Page:
      type: object
      required: [has_more, cursor]
      properties:
        has_more:
          type: boolean
        cursor:
          type: [string, 'null']
    MemberBase:
      type: object
      properties:
        user_id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [agent, administrator]
        switchable:
          type: boolean
          description: False for administrators, who act by their role.
        granted_at:
          type: [string, 'null']
          format: date-time
    OrderRoleMember:
      allOf:
        - $ref: '#/components/schemas/MemberBase'
        - type: object
          properties:
            can_act:
              type: boolean
            permissions:
              $ref: '#/components/schemas/Permissions'
    DiscountGrantMember:
      allOf:
        - $ref: '#/components/schemas/MemberBase'
        - type: object
          properties:
            can_give:
              type: boolean
    SetupOverview:
      type: object
      properties:
        checks:
          type: object
          properties:
            store: {type: boolean}
            channels: {type: boolean}
            staff: {type: boolean}
            ai: {type: boolean}
        review_digests:
          type: object
          properties:
            staff:
              type: string
            ai:
              type: string
        ready:
          type: boolean
        complete:
          type: boolean
        completed_at:
          type: [string, 'null']
          format: date-time
        store:
          type: [object, 'null']
          properties:
            domain:
              type: string
            state:
              type: string
              enum: [working, broken]
            checked_at:
              type: [string, 'null']
              format: date-time
        channels:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        members_count:
          type: integer
        ai_connected:
          type: boolean
        ai_state:
          type: [string, 'null']
        managed_by_app:
          type: boolean
        through_app:
          type: boolean
        order_actions:
          type: array
          description: The ten latest accepted order actions.
          items:
            type: object
            properties:
              action:
                $ref: '#/components/schemas/ActionName'
              order_number:
                type: [string, 'null']
              completed_at:
                type: [string, 'null']
                format: date-time
              conversation_id:
                type: [integer, 'null']
    WorkspaceLayout:
      type: object
      required: [schema_version, placements]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          examples: [1]
        placements:
          type: object
          additionalProperties: false
          required: [conversation-sidebar, workspace-header]
          properties:
            conversation-sidebar:
              $ref: '#/components/schemas/WorkspacePlacement'
            workspace-header:
              $ref: '#/components/schemas/WorkspacePlacement'
    WorkspacePlacement:
      type: array
      maxItems: 50
      items:
        type: object
        required: [id, collapsed]
        additionalProperties: false
        properties:
          id:
            type: string
            description: A widget id of custom/config/workspace_widgets.json (customer-profile, purchase-statistics, orders, sla-overview, notifications).
          collapsed:
            type: boolean
    WorkspaceLayoutRead:
      type: object
      required: [layout, revision, source, unavailable]
      properties:
        layout:
          $ref: '#/components/schemas/WorkspaceLayout'
        revision:
          type: string
          examples: ['3:1']
        source:
          type: string
          enum: [personal, account, product]
        unavailable:
          type: array
          description: Widget ids in the layout this installation does not have.
          items:
            type: string
    WorkspaceAdministration:
      type: object
      required: [layout, revision, members]
      properties:
        layout:
          $ref: '#/components/schemas/WorkspaceLayout'
        revision:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer
              name:
                type: string
              role:
                type: string
    WidgetSettings:
      type: object
      additionalProperties: false
      properties:
        position:
          type: string
          enum: [left, right]
        type:
          type: string
          enum: [standard, expanded_bubble]
        icon:
          type: string
          enum: [chat, message, help, custom]
        theme:
          type: string
          enum: [light, dark, auto]
        language_mode:
          type: string
          enum: [fixed, browser]
        launcher_title:
          type: string
          maxLength: 60
        offset_x:
          type: integer
          minimum: 0
          maximum: 160
        offset_y:
          type: integer
          minimum: 0
          maximum: 160
        locale:
          type: string
        visibility:
          type: object
          required: [mode, rules]
          properties:
            mode:
              type: string
              enum: [all, include, exclude]
            rules:
              type: array
              maxItems: 20
              items:
                type: object
                properties:
                  path:
                    type: string
                    maxLength: 512
                  match:
                    type: string
                    enum: [exact, prefix]
        starters:
          type: array
          maxItems: 30
          description: At most six enabled.
          items:
            type: object
            required: [id, label, message, enabled]
            properties:
              id:
                type: string
                maxLength: 80
              label:
                type: string
                maxLength: 60
              message:
                type: string
                maxLength: 500
              enabled:
                type: boolean
        links:
          type: array
          maxItems: 30
          description: At most six enabled.
          items:
            type: object
            required: [id, label, kind, enabled]
            properties:
              id:
                type: string
                maxLength: 80
              label:
                type: string
                maxLength: 60
              kind:
                type: string
                enum: [article, url]
              url:
                type: string
                format: uri
                description: 'HTTPS, for `kind: url`.'
              article_id:
                type: integer
                description: 'A published article of the inbox''s portal, for `kind: article`.'
              enabled:
                type: boolean
    WidgetNative:
      type: object
      description: Chatwoot's own inbox and channel fields the editor also changes.
      additionalProperties: false
      properties:
        name:
          type: string
        portal_id:
          type: [integer, 'null']
        widget_color:
          type: string
          pattern: '^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
        welcome_title:
          type: [string, 'null']
          maxLength: 120
        welcome_tagline:
          type: [string, 'null']
          maxLength: 255
        reply_time:
          type: string
    WidgetImageUpload:
      type: object
      required: [data]
      properties:
        data:
          type: string
          contentEncoding: base64
          description: PNG, JPEG, WebP or SVG (sanitized), at most 1 MB and 4096×4096 px. SVG only for the icon.
    WebsiteWidgetPublication:
      type: object
      required: [revision, settings]
      additionalProperties: false
      properties:
        revision:
          type: string
        settings:
          $ref: '#/components/schemas/WidgetSettings'
        native:
          $ref: '#/components/schemas/WidgetNative'
        icon_image:
          $ref: '#/components/schemas/WidgetImageUpload'
        remove_icon:
          type: boolean
        avatar_image:
          $ref: '#/components/schemas/WidgetImageUpload'
        remove_avatar:
          type: boolean
    WebsiteWidgetConfiguration:
      type: object
      x-notes: '`public` is the configuration the website sees (the settings with only enabled starters and links, links resolved to URLs, and `icon_url`); `channel` is the camelCase preview config the widget script reads.'
      properties:
        revision:
          type: string
          description: SHA-256 fingerprint of the published values; send it back to publish.
        settings:
          $ref: '#/components/schemas/WidgetSettings'
        native:
          $ref: '#/components/schemas/WidgetNative'
        avatar_url:
          type: [string, 'null']
        icon_url:
          type: [string, 'null']
        public:
          type: object
          additionalProperties: true
        website_token:
          type: string
        portals:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
              config:
                type: [object, 'null']
        articles:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              portal_id:
                type: integer
              slug:
                type: string
        locales:
          type: array
          items:
            type: string
        channel:
          type: object
          additionalProperties: true
    SupportSubmission:
      type: object
      required: [uuid]
      properties:
        uuid:
          type: string
          format: uuid
        body:
          type: string
        files:
          type: array
          maxItems: 5
          description: '`reference`s of staged uploads, at most 24 hours old.'
          items:
            type: string
    SupportFile:
      type: object
      properties:
        reference:
          type: string
        filename:
          type: string
        size:
          type: integer
        type:
          type: string
          description: Content type.
    SupportRequest:
      type: object
      properties:
        reference:
          type: string
          format: uuid
        author:
          type: object
          properties:
            name:
              type: string
            administrator:
              type: boolean
        category:
          type: string
          enum: [problem, question, suggestion]
        status:
          type: string
          description: The status of the request at Inclamo support (open, pending, resolved, snoozed).
        created_at:
          type: string
          format: date-time
        context:
          type: object
          additionalProperties: true
        unread:
          type: boolean
        preview:
          type: string
          maxLength: 160
        delivery:
          type: [string, 'null']
          enum: [failed, attachments_pending, queued, delivered, null]
        can_verify_email:
          type: boolean
        notifications_enabled:
          type: boolean
    SupportRequestDetail:
      allOf:
        - $ref: '#/components/schemas/SupportRequest'
        - type: object
          properties:
            last_reply_id:
              type: integer
            messages:
              type: array
              x-notes: '`actor` and the file entries come from Inclamo support; each file gets a download `url`.'
              items:
                type: object
                properties:
                  id: {}
                  submission_uuid:
                    type: [string, 'null']
                  body:
                    type: string
                  actor: {}
                  direction:
                    type: string
                  sent_at:
                    type: string
                    format: date-time
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                      additionalProperties: true
            submissions:
              type: array
              items:
                type: object
                properties:
                  uuid:
                    type: string
                  body:
                    type: string
                  actor:
                    type: object
                    properties:
                      name:
                        type: string
                      administrator:
                        type: boolean
                  state:
                    type: string
                  error:
                    type: [string, 'null']
                  created_at:
                    type: string
                    format: date-time
                  files:
                    type: array
                    items:
                      allOf:
