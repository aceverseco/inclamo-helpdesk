  # ─────────────────────────── Shopify connection ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/shopify/connection:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Shopify connection]
      operationId: inclamoShopifyConnectionShow
      summary: The store connection
      description: Every member may read it. No answer carries a secret or a token.
      responses:
        '200':
          description: 'The connection, or `connected: false`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Shopify connection]
      operationId: inclamoShopifyConnectionCreate
      summary: Connect the store
      description: |
        With a custom app's client credentials, with a legacy Admin API access
        token, or, for an account the Inclamo store app provisioned,
        `via: "app"` with nothing else. Reconnecting the same store answers
        `200`; another store while one is connected is refused
        (`already_connected`).
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Client credentials
                  type: object
                  required: [shop_domain, client_id, client_secret]
                  properties:
                    shop_domain:
                      type: string
                      examples: [my-store.myshopify.com]
                    client_id:
                      type: string
                    client_secret:
                      type: string
                - title: Legacy access token
                  type: object
                  required: [shop_domain, access_token]
                  properties:
                    shop_domain:
                      type: string
                    access_token:
                      type: string
                - title: Through the store app
                  type: object
                  required: [via]
                  properties:
                    via:
                      const: app
      responses:
        '200':
          description: The connection, updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnection'
        '201':
          description: The connection, made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` (not an administrator) or `managed_by_app` (the app manages this account''s connection).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'
        '422':
          description: |
            `encryption_not_configured`, `already_connected`, `not_through_app`,
            `other_store`, `missing_scopes` (with `missing_scopes`),
            `invalid_domain`, `app_not_installed`, `credentials_refused`,
            `key_refused`, `orders_refused`, `shop_unavailable`, or a reason
            the store app gave for refusing a key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'
        '502':
          description: '`store_unreachable` or `app_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'
    delete:
      tags: [Shopify connection]
      operationId: inclamoShopifyConnectionDestroy
      summary: Remove the store connection
      x-required-role: administrator
      responses:
        '204':
          description: Removed (or there was none).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` or `managed_by_app`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'

  /api/v1/accounts/{account_id}/inclamo/shopify/connection/recheck:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Shopify connection]
      operationId: inclamoShopifyConnectionRecheck
      summary: Check the connection again
      x-required-role: administrator
      responses:
        '200':
          description: The connection after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'
        '404':
          description: '`not_connected`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'
        '422':
          description: As for connecting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'
        '502':
          description: '`store_unreachable` or `app_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionError'

