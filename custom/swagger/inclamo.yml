          application/json:
            schema:
              $ref: '#/components/schemas/DiscountPresetInput'
      responses:
        '201':
          $ref: '#/components/responses/DiscountPresetSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '422':
          $ref: '#/components/responses/DiscountPresetInvalid'

  /api/v1/accounts/{account_id}/inclamo/discount_presets/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Discounts]
      operationId: inclamoDiscountPresetsUpdate
      summary: Change a preset
      description: Also accepted as `PUT`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountPresetInput'
      responses:
        '200':
          $ref: '#/components/responses/DiscountPresetSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OverlayForbidden'
        '404':
          description: No such preset.
        '422':
          $ref: '#/components/responses/DiscountPresetInvalid'
