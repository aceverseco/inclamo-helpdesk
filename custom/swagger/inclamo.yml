              role:
                type: string
                enum: [shopper, agent, team]
              text: {type: string}
              files:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    file_type: {type: string}
                    content_type: {type: ['string', 'null']}
                    file_size: {type: ['integer', 'null']}
                    url: {type: ['string', 'null']}
    CallFiling:
      type: object
      required: [call_id, entry, ended_at, outcome, needs_team, record]
      properties:
        call_id:
          type: string
          pattern: '^[A-Za-z0-9_:.\-]{1,100}$'
        entry:
          type: string
          enum: [inbound, outbound, web]
        line:
          type: [string, 'null']
          description: The number called or calling from, E.164.
          pattern: '^\+[1-9]\d{1,14}$'
        ended_at:
          type: string
          format: date-time
          description: With a zone, years 2000–2100.
        duration:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000
        recording_url:
          type: [string, 'null']
          format: uri
          maxLength: 1500
          description: HTTPS.
        caller:
          type: [object, 'null']
          properties:
            phone:
              type: [string, 'null']
              pattern: '^\+[1-9]\d{1,14}$'
            email:
              type: [string, 'null']
              maxLength: 255
            name:
              type: [string, 'null']
              maxLength: 255
        outcome:
          type: string
          pattern: '^[a-z0-9_]{1,50}$'
        needs_team:
          type: boolean
        priority:
          type: [string, 'null']
          enum: [low, medium, high, urgent, null]
        labels:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^inclamo_[a-z0-9_]+$'
        turns:
          type: array
          maxItems: 500
          items:
            type: object
            required: [role, text]
            properties:
              role:
                type: string
                enum: [caller, agent]
              text:
                type: string
                minLength: 1
                maxLength: 10000
              at:
                type: [string, 'null']
                format: date-time
        record:
          type: string
          minLength: 1
          maxLength: 8000
          description: The call's record, filed as a private note.
    CallRefusal:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
