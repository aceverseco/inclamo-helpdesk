openapi: 3.1.0
info:
  title: Inclamo Helpdesk overlay API
  version: 0.1.0
  summary: The endpoints the Inclamo overlay adds to Chatwoot Community Edition.
  description: |
    Inclamo Helpdesk is Chatwoot Community Edition with the Inclamo overlay
    (`custom/`). This document describes only the endpoints the overlay adds,
    drawn by `custom/config/routes.rb`. Chatwoot's own API is described by the
    specification of the Chatwoot tag the helpdesk is built on
    (`x-chatwoot-version`).

    Every path under `/api/v1/accounts/{account_id}/inclamo/` goes through
    Chatwoot's account controller: the caller is a member of the account,
    signed in with a user access token (`api_access_token` header or
    `Authorization: Bearer`) or with a dashboard session. Agent bot tokens
    are refused on these paths, except on the AI agent connector paths,
    which accept only the connected AI agent's bot token. A caller who is not
    a member of the account gets Chatwoot's `401`.

    Some answers are built from what the connected Shopify store returns;
    where this document cannot say more than the code guarantees, the
    operation's `x-notes` says so.

    Routes the overlay draws but does not publish (the signed support intake,
    the store app's signed calls) are listed with their reasons in
    `custom/swagger/excluded-routes.yml`; `scripts/check-openapi-routes.rb`
    fails the build when a route is in neither file.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  x-chatwoot-version: v4.19.1
servers:
  - url: '{origin}'
    description: The address of your helpdesk installation.
    variables:
      origin:
        default: http://localhost:3000
        description: Scheme, host and port of the installation.
security:
  - userApiKey: []
  - userBearerAuth: []
  - sessionAccessToken: []
    sessionClient: []
    sessionUid: []
tags:
  - name: Instance
    description: The installation's health and public assets. No sign-in.
  - name: Overlay status
    description: Whether the overlay is present and which versions run.
  - name: Helpdesk setup
    description: The administrator's setup checklist (Settings → Helpdesk setup).
  - name: Workspace layout
    description: The widgets of a member's workspace and the account's default layout.
  - name: Website widget
    description: The website chat widget of a web widget inbox. Administrators only.
  - name: In-product support
    description: Requests a member sends to Inclamo support from inside the helpdesk.
  - name: Help Center
    description: Previews of unpublished Help Center articles.
  - name: Staff permissions
    description: Which members may act on orders and give discounts. Administrators only.
  - name: Shopify connection
    description: The account's connection to its Shopify store.
  - name: Order panel
    description: The "Orders" section of a conversation.
  - name: Order actions
    description: Actions on the store's orders and customers from a conversation, and their previews.
  - name: Macros
    description: Previews and confirmations of macros with order steps.
  - name: Discounts
    description: The discount presets agents may give.
  - name: Rule presets
    description: Ready automation rules switched on with one toggle. Administrators only.
  - name: Team queues
    description: Conversation queues shared by the whole account.
  - name: SLA
    description: SLA policies, their summary and the timers of conversations.
  - name: AI agent connection
    description: Connecting the AI agent and choosing its inboxes. Administrators only.
  - name: AI policies
    description: What the AI agent may do on its own, per action. Administrators only.
  - name: AI proposals
    description: Order actions the AI agent proposed, reviewed by staff.
  - name: AI agent connector
    description: |
      The calls the connected AI agent makes with its agent bot token
      (docs/ai-connector.md §5, docs/ai-connector-calls.md). Any other token,
      a person's session or the bot of a disconnected account is refused
      with 401.
  - name: Shopper requests
    description: Shopify's requests about one shopper (erasure, data request). Administrators only.
x-tagGroups:
  - name: Installation
    tags: [Instance, Overlay status, Helpdesk setup]
  - name: Workspace
    tags: [Workspace layout, Website widget, In-product support, Help Center, Team queues, SLA]
  - name: Store and orders
    tags: [Shopify connection, Order panel, Order actions, Macros, Discounts, Rule presets, Staff permissions, Shopper requests]
  - name: AI agent
    tags: [AI agent connection, AI policies, AI proposals, AI agent connector]

paths:
  # ───────────────────────────── Instance ─────────────────────────────
  /inclamo/health:
    get:
      tags: [Instance]
      operationId: inclamoHealth
      summary: Health of the installation
      description: |
        For a monitor outside the machine. `200` when every check passes,
        `503` with the names of the failing checks otherwise. The answer
        carries nothing else (no counts, settings or error text).
      security: []
      responses:
        '200':
          description: Every check passes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one check fails.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /inclamo/widget-images/{id}:
    get:
      tags: [Instance]
      operationId: inclamoWidgetImage
      summary: A validated website-widget SVG image
      description: |
        Public delivery of a sanitized SVG launcher icon. The address comes
        from the widget's configuration (`icon_url`); a plain Active Storage
        blob id does not open it. Served with a long, immutable cache.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The image's signed id, as it appears in `icon_url`.
          schema:
            type: string
      responses:
        '200':
          description: The SVG.
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '304':
          description: Not modified (ETag / Last-Modified).
        '404':
          description: Unknown or invalid signature, or not a validated SVG.

  # ─────────────────────────── Overlay status ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/status:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Overlay status]
      operationId: inclamoStatus
      summary: Overlay version and pending migrations
      responses:
        '200':
          description: The overlay runs.
          content:
            application/json:
              schema:
                type: object
                required: [overlay_version, chatwoot_version, migrations_pending]
                properties:
                  overlay_version:
                    type: string
                    examples: ['0.1.0']
                  chatwoot_version:
                    type: string
                    examples: ['4.19.1']
                  migrations_pending:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────── Helpdesk setup ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/setup:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Helpdesk setup]
      operationId: inclamoSetupShow
      summary: The setup checklist
      x-required-role: administrator
      responses:
        '200':
          description: The checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
    patch:
      tags: [Helpdesk setup]
      operationId: inclamoSetupReview
      summary: Mark a review step as reviewed
      description: |
        Records that the administrator reviewed the staff permissions or the AI
        policies as they are now. `digest` must be the step's current value
        from `review_digests`; a changed one is `409 review_changed`. Also
        accepted as `PUT`.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, digest]
              properties:
                step:
                  type: string
                  enum: [staff, ai]
                digest:
                  type: string
                  description: The step's value from `review_digests`.
      responses:
        '200':
          description: The checklist after the review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '409':
          description: '`review_changed`: the step changed since it was read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  /api/v1/accounts/{account_id}/inclamo/setup/complete:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Helpdesk setup]
      operationId: inclamoSetupComplete
      summary: Complete the setup
      x-required-role: administrator
      responses:
        '200':
          description: The completed checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '409':
          description: '`setup_incomplete`: the checklist with `error` added, not every check passes.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SetupOverview'
                  - type: object
                    properties:
                      error:
                        const: setup_incomplete

  # ─────────────────────────── Workspace layout ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/workspace_layout:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Workspace layout]
      operationId: inclamoWorkspaceLayoutShow
      summary: The signed-in member's workspace layout
      responses:
        '200':
          description: The layout in effect for the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLayoutRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Workspace layout]
      operationId: inclamoWorkspaceLayoutUpdate
      summary: Save the member's own layout
      description: Also accepted as `PUT`. `revision` is the one last read; another is `409 layout_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout, revision]
              properties:
                layout:
                  $ref: '#/components/schemas/WorkspaceLayout'
                revision:
                  type: string
      responses:
        '200':
          description: The saved layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLayoutRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/LayoutConflict'
        '422':
          $ref: '#/components/responses/LayoutInvalid'
    delete:
      tags: [Workspace layout]
      operationId: inclamoWorkspaceLayoutReset
      summary: Drop the member's own layout
      description: The member gets the account's default layout (or the product's) again.
      parameters:
        - name: revision
          in: query
          required: true
          description: The revision last read. Rails also reads it from a JSON body.
          schema:
            type: string
      responses:
        '200':
          description: The layout in effect after the reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLayoutRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/LayoutConflict'

  /api/v1/accounts/{account_id}/inclamo/workspace_layout/administration:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Workspace layout]
      operationId: inclamoWorkspaceLayoutAdministration
      summary: The account's default layout and its members
      x-required-role: administrator
      responses:
        '200':
          description: The default layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAdministration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'

  /api/v1/accounts/{account_id}/inclamo/workspace_layout/administer:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    put:
      tags: [Workspace layout]
      operationId: inclamoWorkspaceLayoutAdminister
      summary: Set the default layout, one member's layout, or everyone's
      description: |
        `target: default` sets the account's default; `member` sets the layout
        of the member `user_id`; `all` sets the default and drops every
        personal layout, and needs `confirmed_count` equal to the number of
        members.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout, revision, target]
              properties:
                layout:
                  $ref: '#/components/schemas/WorkspaceLayout'
                revision:
                  type: string
                  description: The `revision` of the administration last read.
                target:
                  type: string
                  enum: [default, member, all]
                user_id:
                  type: integer
                  description: 'With `target: member`.'
                confirmed_count:
                  type: integer
                  description: 'With `target: all`, the number of members the administrator confirmed.'
      responses:
        '200':
          description: The administration after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAdministration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LayoutConflict'
        '422':
          $ref: '#/components/responses/LayoutInvalid'

  # ─────────────────────────── Website widget ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/website_widgets/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WebWidgetInboxId'
    get:
      tags: [Website widget]
      operationId: inclamoWebsiteWidgetShow
      summary: The widget's configuration
      x-required-role: administrator
      responses:
        '200':
          description: The configuration and what the editor needs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteWidgetConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '404':
          description: No such inbox, or it is not a web widget inbox.
    patch:
      tags: [Website widget]
      operationId: inclamoWebsiteWidgetUpdate
      summary: Publish the widget's configuration
      description: Also accepted as `PUT`. `configuration.revision` is the one last read.
      x-required-role: administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration:
                  $ref: '#/components/schemas/WebsiteWidgetPublication'
      responses:
        '200':
          description: The configuration as published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteWidgetConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '404':
          description: No such inbox or portal, or the inbox is not a web widget inbox.
        '409':
          description: Another administrator changed the settings since they were read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatwootError'
        '422':
          description: The configuration is refused; `error` is a sentence for the form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatwootError'

  /api/v1/accounts/{account_id}/inclamo/website_widgets/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WebWidgetInboxId'
    get:
      tags: [Website widget]
      operationId: inclamoWebsiteWidgetPreview
      summary: An HTML page that previews the widget
      description: For the editor's preview frame.
      x-required-role: administrator
      responses:
        '200':
          description: The preview page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEmpty'
        '404':
          description: No such inbox, or it is not a web widget inbox.

  # ─────────────────────────── In-product support ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/support/metadata:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [In-product support]
      operationId: inclamoSupportMetadata
      summary: What the support form needs
      responses:
        '200':
          description: The author, the account and the file limits.
          content:
            application/json:
              schema:
                type: object
                required: [author, account, version, max_files, max_bytes]
                properties:
                  author:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                  account:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  version:
                    type: string
                    description: The overlay version.
                  max_files:
                    type: integer
                    examples: [5]
                  max_bytes:
                    type: integer
                    examples: [10485760]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/accounts/{account_id}/inclamo/support/uploads:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [In-product support]
      operationId: inclamoSupportUpload
      summary: Stage a file for a request
      description: |
        The file is kept for 24 hours; name its `reference` in `files` of a
        request or a reply to attach it. At most 20 uploads per member in the
        limiter's window.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '201':
          description: The staged file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/SupportInvalid'
        '429':
          $ref: '#/components/responses/SupportRateLimited'

  /api/v1/accounts/{account_id}/inclamo/support/requests:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [In-product support]
      operationId: inclamoSupportRequestsIndex
      summary: The member's support requests
      description: The 100 most recently updated requests the member may see. Also schedules a sync with Inclamo support.
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [In-product support]
      operationId: inclamoSupportRequestsCreate
      summary: Send a new support request
      description: |
        `uuid` names the request and its first message; sending the same
        request again with the same `uuid`, body and files answers the request
        already made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SupportSubmission'
                - type: object
                  required: [category]
                  properties:
                    category:
                      type: string
                      enum: [problem, question, suggestion]
                    context:
                      type: object
                      properties:
                        browser:
                          type: string
                          maxLength: 200
                        location:
                          type: string
                          enum: [conversation, inbox, settings, contacts, reports, workspace]
                        conversation_reference:
                          type: string
                          pattern: '^\d{1,15}$'
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SupportConflict'
        '422':
          $ref: '#/components/responses/SupportInvalid'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
    get:
      tags: [In-product support]
      operationId: inclamoSupportRequestsShow
      summary: One support request with its messages
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
    post:
      tags: [In-product support]
      operationId: inclamoSupportRequestsReply
      summary: Reply in a support request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportSubmission'
      responses:
        '201':
          description: The request with the reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SupportConflict'
        '422':
          $ref: '#/components/responses/SupportInvalid'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/read:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
    post:
      tags: [In-product support]
      operationId: inclamoSupportRequestsRead
      summary: Mark replies as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursor]
              properties:
                cursor:
                  type: integer
                  minimum: 0
                  description: The last reply read; at most the request's `last_reply_id`.
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/SupportInvalid'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/retry/{uuid}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
      - name: uuid
        in: path
        required: true
        description: The `uuid` of the submission to deliver again.
        schema:
          type: string
          format: uuid
    post:
      tags: [In-product support]
      operationId: inclamoSupportRequestsRetry
      summary: Deliver a failed submission again
      responses:
        '200':
          description: The request, the submission queued again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/attachments/{file_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
      - $ref: '#/components/parameters/SupportFileId'
    get:
      tags: [In-product support]
      operationId: inclamoSupportAttachment
      summary: Download a file Inclamo support sent
      description: Fetched from Inclamo support and passed on as an attachment download.
      responses:
        '200':
          $ref: '#/components/responses/SafeDownload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SupportUnavailable'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/uploads/{file_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
      - $ref: '#/components/parameters/SupportFileId'
    get:
      tags: [In-product support]
      operationId: inclamoSupportUploadDownload
      summary: Download a file the team attached
      responses:
        '200':
          $ref: '#/components/responses/SafeDownload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/recipient:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
    post:
      tags: [In-product support]
      operationId: inclamoSupportRecipient
      summary: Email notifications for the request's author
      description: |
        Only the request's author. With `enabled`, switches the member's email
        notifications on or off, then tells Inclamo support the recipient.
      x-notes: |
        The 200 body is Inclamo support's answer passed through unchanged
        (Inclamo::Support::Transport#recipient); its shape is decided by that
        service and is not determinable from this repository.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Inclamo support's answer.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such request, or the member is not its author.
        '503':
          $ref: '#/components/responses/SupportUnavailable'

  /api/v1/accounts/{account_id}/inclamo/support/requests/{id}/recipient/verify:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupportRequestId'
    post:
      tags: [In-product support]
      operationId: inclamoSupportRecipientVerify
      summary: Confirm the author's email with a code
      x-notes: The 200 body is Inclamo support's answer passed through unchanged; not determinable from this repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Inclamo support's answer.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such request, or the member is not its author.
        '503':
          $ref: '#/components/responses/SupportUnavailable'

