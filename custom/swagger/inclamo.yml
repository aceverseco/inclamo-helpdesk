          $ref: '#/components/responses/StoreUnreachable'
    delete:
      tags: [Order panel]
      operationId: inclamoOrderPanelClearOrder
      summary: Clear the marked order
      responses:
        '200':
          $ref: '#/components/responses/OrderPanel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/products:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Order panel]
      operationId: inclamoProductsSearch
      summary: Search the store's catalogue
      description: |
        Active products that are not gift cards, by the beginnings of the words
        of their title or by SKU, ten a page. An empty query finds nothing.
        Needs the `read_products` scope.
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: after
          in: query
          description: The `page.cursor` of the previous answer.
          schema:
            type: string
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                type: object
                required: [products, page]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  page:
                    $ref: '#/components/schemas/Page'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StoreRefusalForbidden'
        '404':
          description: '`not_connected`, or no such conversation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'
        '409':
          description: '`connection_broken`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'
        '422':
          description: '`missing_scope` with `missing_scopes`, or a refusal of the store.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StoreRefusal'
                  - type: object
                    properties:
                      missing_scopes:
                        type: array
                        items:
                          type: string
        '502':
          $ref: '#/components/responses/StoreRefusalGateway'

  # ─────────────────────────── Order actions ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Order actions]
      operationId: inclamoOrderActionsIndex
      summary: Every attempt made from this conversation
      description: The 100 newest, newest first.
      responses:
        '200':
          description: The attempts.
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Order actions]
      operationId: inclamoOrderActionsCreate
      summary: Act on an order or customer
      description: |
        Whether the member may act and whether the store allows it is decided
        on the server. `action_id` is the caller's key for the attempt: sending
        the same attempt again settles it instead of acting twice; another
        attempt under a used key is refused. The status says the outcome:
        `200` accepted, `202` still pending/running/unknown, `403`
        `not_allowed`, `422` refused — the body is the attempt in every case.
      x-notes: |
        `params` depends on `action_name` and is read by the action's handler
        in custom/lib/inclamo/shopify/actions/ (for example `mode`/`amount`
        for a refund, `refund` for a cancellation, `lines`/`additions` for an
        items edit, `lines`/`discount`/`shipping` for a new order); this
        document does not restate each handler's parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_name, action_id]
              properties:
                action_name:
                  $ref: '#/components/schemas/ActionName'
                action_id:
                  type: string
                  pattern: '^[A-Za-z0-9-]{8,64}$'
                order_id:
                  type: string
                  description: Needed by every action except customer, new order and discount actions.
                customer_id:
                  type: string
                  description: Needed by `customer_tags` and `customer_note`.
                params:
                  type: object
                  additionalProperties: true
                address:
                  type: object
                  additionalProperties: true
                  description: For `address`, the new shipping address.
                note:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OrderActionResult'
        '202':
          $ref: '#/components/responses/OrderActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderActionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The attempt, refused; or `invalid_request` with a message when the record itself is invalid.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderAction'
                  - $ref: '#/components/schemas/OverlayError'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
      - name: id
        in: path
        required: true
        description: The attempt's `action_id`.
        schema:
          type: string
    get:
      tags: [Order actions]
      operationId: inclamoOrderActionsShow
      summary: One attempt
      responses:
        '200':
          $ref: '#/components/responses/OrderActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions/refund_preview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Order actions]
      operationId: inclamoOrderActionsRefundPreview
      summary: What a refund would give back
      description: Nothing is changed or recorded.
      requestBody:
        $ref: '#/components/requestBodies/OrderPreview'
      responses:
        '200':
          description: The refund as it would be made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StoreRefusalForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/StoreRefusalInvalid'
        '502':
          $ref: '#/components/responses/StoreRefusalGateway'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions/cancel_preview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Order actions]
      operationId: inclamoOrderActionsCancelPreview
      summary: What a cancellation would give back
      description: |
        Always `200`. Without `params.refund: true` the body is empty. With it,
        `amount`/`currency`, or `refund` saying why there is none (`unpaid`,
        `none_left`, `unknown`). When the cancellation would be refused, the
        body names the refusal instead.
      requestBody:
        $ref: '#/components/requestBodies/OrderPreview'
      responses:
        '200':
          description: The preview or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: string
                  currency:
                    type: string
                  refund:
                    type: string
                    enum: [unpaid, none_left, unknown]
                  refusal:
                    type: string
                  message:
                    type: [string, 'null']
                  reason:
                    type: string
                  missing_scopes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions/edit_items_preview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Order actions]
      operationId: inclamoOrderActionsEditItemsPreview
      summary: What an items edit would make of the order
      description: The order as the store calculates it after the edit; nothing is committed.
      x-notes: '`params.lines` / `params.additions` are read by Inclamo::Shopify::Actions::EditItems; their item shapes are not restated here.'
      requestBody:
        $ref: '#/components/requestBodies/OrderPreview'
      responses:
        '200':
          description: The edited order's summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditItemsPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StoreRefusalForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/StoreRefusalInvalid'
        '502':
          $ref: '#/components/responses/StoreRefusalGateway'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions/new_order_preview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Order actions]
      operationId: inclamoOrderActionsNewOrderPreview
      summary: What a new order would cost
      description: The store's calculation for the matched customer; nothing is created.
      x-notes: '`params.lines`, `params.discount` and `params.shipping` are read by Inclamo::Shopify::Actions::NewOrder; their shapes are not restated here.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params]
              properties:
                params:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: The calculation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewOrderPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StoreRefusalForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/StoreRefusalInvalid'
        '502':
          $ref: '#/components/responses/StoreRefusalGateway'

  /api/v1/accounts/{account_id}/inclamo/shopify/conversations/{conversation_id}/actions/new_order_prefill:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Order actions]
      operationId: inclamoOrderActionsNewOrderPrefill
      summary: The items of a customer's order, to order again
      parameters:
        - name: order_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One line per variant at its current quantity; items the catalogue would not offer are in `skipped`.
          content:
            application/json:
              schema:
                type: object
                required: [order_number, lines, skipped]
                properties:
                  order_number:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          $ref: '#/components/schemas/Product'
                        variant:
                          $ref: '#/components/schemas/ProductVariant'
                        quantity:
                          type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        quantity:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StoreRefusalForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/StoreRefusalInvalid'
        '502':
          $ref: '#/components/responses/StoreRefusalGateway'

  # ─────────────────────────── Macros ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/macro_previews:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Macros]
      operationId: inclamoMacroPreview
      summary: What a macro's order steps would do in a conversation
      description: For the confirmation shown before the macro runs. Every step is checked again when it runs.
      x-notes: |
        Each entry of `steps` is `{position, step}` merged with that step's
        preview (as the cancel preview: `amount`/`currency`, `refund`, `units`
        for a replacement, or a refusal), or `{after_stop: true}` for steps
        after one that stops the macro; built by
        Inclamo::Shopify::MacroSteps::Preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [macro_id, conversation_id]
              properties:
                macro_id:
                  type: integer
                conversation_id:
                  type: integer
                  description: The conversation's display id.
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema:
                type: object
                required: [digest, order, steps]
                properties:
                  digest:
                    type: string
                    description: Send it back to `macro_confirmations`.
                  order:
                    type: [object, 'null']
                    properties:
                      id:
                        type: string
                      number:
                        type: [string, 'null']
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: integer
                        step:
                          type: string
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{account_id}/inclamo/macro_confirmations:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Macros]
      operationId: inclamoMacroConfirmation
      summary: Confirm a macro with order steps
      description: |
        The member's "Run". Kept a short while for Chatwoot's macro run that
        follows; without it the run does nothing for the order steps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [macro_id, conversation_id, digest]
              properties:
                macro_id:
                  type: integer
                conversation_id:
                  type: integer
                  description: The conversation's display id.
                digest:
                  type: string
                  description: The `digest` of the preview the member saw.
      responses:
        '204':
          description: Confirmed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`macro_changed`: the macro changed since the preview.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlayError'

  # ─────────────────────────── Discounts ───────────────────────────
  /api/v1/accounts/{account_id}/inclamo/discount_presets:
    parameters:
      - $ref: '#/components/parameters/AccountId'
