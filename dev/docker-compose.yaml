# Development stack: the helpdesk image with Postgres and Redis.
#
#   HELPDESK_IMAGE=inclamo-helpdesk:0.1.0-cw4.19.1 docker compose -f dev/docker-compose.yaml up -d
#   docker compose -f dev/docker-compose.yaml run --rm rails bundle exec rails db:chatwoot_prepare
#
# With dev/docker-compose.mount.yaml added, the official Chatwoot image runs
# with custom/ and the loader files mounted from this checkout: backend changes
# show after a restart, without building an image.

x-app: &app
  image: ${HELPDESK_IMAGE:-chatwoot/chatwoot:v4.19.1-ce}
  env_file: .env
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
  depends_on:
    - postgres
    - redis
  volumes:
    - storage:/app/storage

services:
  rails:
    <<: *app
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    ports:
      - '127.0.0.1:${HELPDESK_PORT:-3000}:3000'
    restart: unless-stopped

  sidekiq:
    <<: *app
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: ['sh', '-c', 'redis-server --requirepass "$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis:/data
    restart: unless-stopped

volumes:
  storage:
  postgres:
  redis:
