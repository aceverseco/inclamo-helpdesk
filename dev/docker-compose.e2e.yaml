# The helpdesk for end-to-end tests: every request to Shopify goes through a
# proxy that the tests control (e2e/proxy/server.mjs). Never for an instance
# that serves real customers: the proxy sees the store's access token.
#
#   docker compose -f dev/docker-compose.yaml -f dev/docker-compose.e2e.yaml up -d
x-e2e: &e2e
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
    - INCLAMO_E2E=1
    - INCLAMO_SHOPIFY_BASE_URL=http://shopify-proxy:8080
    # The tests sign in and call the API far more often than a person would.
    - ENABLE_RACK_ATTACK=false

services:
  rails:
    <<: *e2e
  sidekiq:
    <<: *e2e
  shopify-proxy:
    image: node:24-alpine
    command: node /proxy/server.mjs
    volumes:
      - ../e2e/proxy:/proxy:ro
    restart: unless-stopped
