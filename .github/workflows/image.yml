name: Image

# The full image build takes about half an hour, so it runs where it matters:
# on main, by hand, and for pull requests that touch what the image is built
# from. A seam patch that does not apply already fails the CI workflow, in
# its assemble step, on every push.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'patches/**'
      - 'shims/**'
      - 'scripts/**'
      - 'custom/CHATWOOT_VERSION'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; on main every merge keeps its own result.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image builds, every seam patch applies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Chatwoot with the patches and the overlay
        run: scripts/assemble.sh build/chatwoot

      - uses: docker/setup-buildx-action@v3

      - name: Build the image with Chatwoot's own Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: build/chatwoot
          file: build/chatwoot/docker/Dockerfile
          push: false
          load: true
          tags: inclamo-helpdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image carries the overlay
        run: |
          docker run --rm --entrypoint sh inclamo-helpdesk:ci -c \
            'test -f custom/config/overlay.rb && test -f config/initializers/00_inclamo_overlay.rb && test -f lib/tasks/inclamo_overlay.rake && test ! -d enterprise && cat custom/INCLAMO_VERSION custom/CHATWOOT_VERSION'
