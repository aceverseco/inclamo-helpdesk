name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend specs on the pinned Chatwoot
    # Chatwoot pins a Ruby patch release; prebuilt rubies lag on the newest runner image.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Chatwoot version
        id: pin
        run: echo "tag=$(cat custom/CHATWOOT_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check out Chatwoot at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: chatwoot/chatwoot
          ref: ${{ steps.pin.outputs.tag }}
          path: build/chatwoot

      - name: Assemble Chatwoot with the patches and the overlay
        run: scripts/assemble.sh build/chatwoot

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: build/chatwoot

      - name: Create the database and load the schema of Chatwoot
        working-directory: build/chatwoot
        run: bundle exec rake db:create db:schema:load

      # Not `db:migrate`: that would rewrite schema.rb, and the test helper of
      # Chatwoot rebuilds the test database whenever schema.rb changed.
      - name: Run the overlay's migrations in the test database
        working-directory: build/chatwoot
        run: bundle exec rake inclamo:db:migrate
        env:
          RAILS_ENV: test

      - name: Run the overlay's specs
        working-directory: build/chatwoot
        run: bundle exec rspec custom/spec --format progress
        env:
          # Throwaway keys: the store connection is refused without encryption.
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci-only-primary-key-0000000000000000
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci-only-deterministic-key-000000000
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci-only-key-derivation-salt-0000000

  graphql:
    name: Shopify documents match the published schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: A document with an unknown field is refused
        run: node scripts/check-graphql.mjs --self-test
      - name: Every document is valid for the pinned API version
        run: node scripts/check-graphql.mjs

  image:
    name: Image builds, every seam patch applies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Chatwoot with the patches and the overlay
        run: scripts/assemble.sh build/chatwoot

      - uses: docker/setup-buildx-action@v3

      - name: Build the image with Chatwoot's own Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: build/chatwoot
          file: build/chatwoot/docker/Dockerfile
          push: false
          load: true
          tags: inclamo-helpdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image carries the overlay
        run: |
          docker run --rm --entrypoint sh inclamo-helpdesk:ci -c \
            'test -f custom/config/overlay.rb && test -f config/initializers/00_inclamo_overlay.rb && test -f lib/tasks/inclamo_overlay.rake && test ! -d enterprise && cat custom/INCLAMO_VERSION custom/CHATWOOT_VERSION'
